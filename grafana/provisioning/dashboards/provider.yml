apiVersion: 1

# Load dashboard JSON files from the mounted dashboards dir on startup.
providers:
  - name: skill-dashboards
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
