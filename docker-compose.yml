# RP AI Portal backend — parameterized for multiple COEXISTING environments.
#
# One codebase / one image, many environments (staging, prod, ...). Each
# environment has its own .env (COMPOSE_PROJECT_NAME, ports, data paths, DB,
# secrets), so several stacks run side-by-side on one host without clashing —
# staging can be stood up for acceptance without touching prod.
#
# Deploy (per environment):
#   1) put the environment's config in ./.env  (CI writes it from a File var)
#   2) docker compose up -d --build
#
# Two services:
#   backend — the FastAPI app; CREDENTIAL-LESS; calls the judge over the network.
#   judge   — kiro-cli semantic judge behind a tiny HTTP API; holds the model
#             credential (SSO login persisted in a named volume). Log in once:
#               docker compose exec judge kiro-cli login --use-device-flow \
#                 --license pro --identity-provider <startUrl> --region <region>

services:
  backend:
    build: .
    image: ${BACKEND_IMAGE:-rp-ai-portal-be}:${IMAGE_TAG:-latest}
    container_name: ${STACK:-ai-portal-be}-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Judge is a sibling service on the compose network (overridable in .env).
      AUDIT_JUDGE_URL: ${AUDIT_JUDGE_URL:-http://judge:8790}
    ports:
      - "${BACKEND_PORT:-9000}:8000"
    volumes:
      - ${SKILL_REPO_HOST:-/proj/rp_ait_prod/data/ai-portal-be/rp-ai-skill}:${SKILL_REPO_PATH:-/proj/radio_ivc_rvc_workspace/ezhgmio/rp-ai-skill}
      - ${LOG_DIR:-/proj/rp_ait_prod/logs/ai-portal-be}:/app/logs
      - ${SSH_DIR:-/proj/rp_ait_prod/services/ai-portal-be/ssh}:/root/.ssh:ro
    depends_on:
      - judge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
    image: ${JUDGE_IMAGE:-skill-audit-judge}:${IMAGE_TAG:-latest}
    container_name: ${STACK:-ai-portal-be}-judge
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8790"
    volumes:
      # Kiro CLI stores its login under ~/.kiro + ~/.local/share/kiro-cli
      # (NOT ~/.aws). Persist BOTH in named volumes so the SSO session survives
      # restarts AND rebuilds. Seed once: device-flow login inside the container
      #   docker compose exec judge kiro-cli login --use-device-flow ...
      # (or copy a host login into these volumes).
      - judge-kiro-home:/root/.kiro
      - judge-kiro-share:/root/.local/share/kiro-cli

volumes:
  judge-kiro-home:
  judge-kiro-share:
