# RP AI Portal backend — Docker Compose deployment.
#
# Prerequisites on the host:
#   * A `.env` file must sit next to this file (it holds DATABASE_URL,
#     GITLAB_TOKEN, etc.). It is gitignored and NOT part of the repo, so copy
#     it onto the server manually.
#   * The skill repo host dir below must exist and be a git repo (with its
#     remote/SSH configured) if you want skill uploads to push to GitLab.
#
# Run:  docker compose up -d --build
# Logs: docker compose logs -f
# API:  http://<host>:9000/health

services:
  backend:
    build:
      context: .
      args:
        # Injected by the CI deploy job as the pushed commit SHA (defaults to
        # "dev" for local builds). Surfaced at GET /api/version.
        GIT_COMMIT: "${GIT_COMMIT:-dev}"
    image: rp-ai-portal-be:latest
    container_name: rp-ai-portal-be
    restart: unless-stopped

    # Loads DATABASE_URL, GITLAB_TOKEN, CORS_ORIGINS, etc. from the host .env.
    env_file:
      - .env

    # Host 9000 -> container 8000 (uvicorn).
    ports:
      - "9000:8000"

    volumes:
      # Skill storage repo: host dir <-> container path (= SKILL_REPO_PATH default).
      - /proj/rp_ait_prod/data/ai-portal-be/rp-ai-skill:/proj/radio_ivc_rvc_workspace/ezhgmio/rp-ai-skill
      # Logs: unified host path <-> container /app/logs (backend.log, access.log).
      - /proj/rp_ait_prod/logs/ai-portal-be:/app/logs
      # SSH key for pushing the skill repo to GitLab over SSH (SKILL_REPO_PUSH=true).
      # The host dir holds id_ed25519 (600) + known_hosts (gitlab host key).
      - /proj/rp_ait_prod/services/ai-portal-be/ssh:/root/.ssh:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Grafana: dashboards for skill metrics (weekly download/upload/update).
  # Reached by the frontend iframe via the reverse-proxied /grafana sub-path,
  # so it must serve from that sub-path. Point its MySQL data source at the
  # SAME external DB as the backend (the host/credentials from DATABASE_URL in
  # .env) — there is no MySQL service in this compose.
  grafana:
    image: grafana/grafana:11.1.0
    container_name: rp-ai-grafana
    restart: unless-stopped
    environment:
      # Public URL incl. /grafana/ sub-path. Override GRAFANA_ROOT_URL in .env
      # if the portal is served on a different host/domain/scheme.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://100.77.162.66:9001/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Allow the dashboard to render inside the portal's <iframe>.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      # Anonymous read-only view (drop these two if you require Grafana login;
      # see the security note — anyone who can reach the portal sees the board).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Admin password for configuring data source / dashboards. Set
      # GRAFANA_ADMIN_PASSWORD in .env; do not ship a weak default to prod.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    # Host 9401 -> container 3000. Optional: prod traffic goes through nginx
    # /grafana; expose it for direct debugging / first-time setup.
    ports:
      - "9401:3000"
    volumes:
      # Persist dashboards, data sources and Grafana's own SQLite state.
      - grafana-data:/var/lib/grafana
      # Auto-provision the MySQL data source + Skill Metrics dashboard on
      # startup (so uid=skill-metrics always exists and is Viewer-readable).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  grafana-data: