# RP AI Portal backend — parameterized for multiple COEXISTING environments.
#
# One codebase / one image, many environments (staging, prod, ...). Each
# environment has its own .env (COMPOSE_PROJECT_NAME, ports, data paths, DB,
# secrets), so several stacks run side-by-side on one host without clashing —
# staging can be stood up for acceptance without touching prod.
#
# Deploy (per environment):
#   1) put the environment's config in ./.env  (CI writes it from a File var)
#   2) docker compose up -d --build
#
# Two services:
#   backend — the FastAPI app; CREDENTIAL-LESS; calls the judge over the network.
#   judge   — kiro-cli semantic judge behind a tiny HTTP API; holds the model
#             credential (SSO login persisted in a named volume). Log in once:
#               docker compose exec judge kiro-cli login --use-device-flow \
#                 --license pro --identity-provider <startUrl> --region <region>

services:
  backend:
    build:
      context: .
      args:
        # Injected by the CI deploy job as the pushed commit SHA (defaults to
        # "dev" for local builds). Surfaced at GET /api/version.
        GIT_COMMIT: "${GIT_COMMIT:-dev}"
    image: ${BACKEND_IMAGE:-rp-ai-portal-be}:${IMAGE_TAG:-latest}
    container_name: ${STACK:-ai-portal-be}-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Judge is a sibling service on the compose network (overridable in .env).
      AUDIT_JUDGE_URL: ${AUDIT_JUDGE_URL:-http://judge:8790}
    ports:
      - "${BACKEND_PORT:-9000}:8000"
    volumes:
      - ${SKILL_REPO_HOST:-/proj/rp_ait_prod/data/ai-portal-be/rp-ai-skill}:${SKILL_REPO_PATH:-/proj/radio_ivc_rvc_workspace/ezhgmio/rp-ai-skill}
      - ${LOG_DIR:-/proj/rp_ait_prod/logs/ai-portal-be}:/app/logs
      - ${SSH_DIR:-/proj/rp_ait_prod/services/ai-portal-be/ssh}:/root/.ssh:ro
    depends_on:
      - judge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Converges the audit projection with the review MRs. The periodic sweep is
  # what makes it correct - the webhook (POST /api/audit/reconcile) only shortens
  # the delay, and both run the same function.
  reconciler:
    image: ${BACKEND_IMAGE:-rp-ai-portal-be}:${IMAGE_TAG:-latest}
    container_name: ${STACK:-ai-portal-be}-reconciler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-300}
    entrypoint: ["python", "-m", "app.reconcile", "--watch"]
    depends_on:
      - backend

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
    image: ${JUDGE_IMAGE:-skill-audit-judge}:${IMAGE_TAG:-latest}
    container_name: ${STACK:-ai-portal-be}-judge
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8790"
    volumes:
      # Kiro CLI stores its login under ~/.kiro + ~/.local/share/kiro-cli
      # (NOT ~/.aws). Persist BOTH in named volumes so the SSO session survives
      # restarts AND rebuilds. Seed once: device-flow login inside the container
      #   docker compose exec judge kiro-cli login --use-device-flow ...
      # (or copy a host login into these volumes).
      - judge-kiro-home:/root/.kiro
      - judge-kiro-share:/root/.local/share/kiro-cli

  # Database for environments without a managed instance (staging, local).
  # Same engine as production so migrations and SQL behaviour match; its own
  # volume, so data survives image rebuilds. Production keeps pointing at its
  # managed MySQL and never starts this service:
  #   staging:    docker compose --profile local-db up -d
  #   production: docker compose up -d
  db:
    image: mysql:8.0
    container_name: ${STACK:-ai-portal-be}-db
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_portal}
      MYSQL_USER: ${MYSQL_USER:-ai_portal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_portal}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ai_portal_root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  # Grafana: dashboards for skill metrics (weekly download/upload/update).
  # Reached by the frontend iframe via the reverse-proxied /grafana sub-path,
  # so it must serve from that sub-path. Point its MySQL data source at the
  # SAME external DB as the backend (the host/credentials from DATABASE_URL in
  # .env) — the default profile has no MySQL service (the `local-db` profile
# used by staging does, and Grafana is not wired to it).
  grafana:
    image: grafana/grafana:11.1.0
    container_name: rp-ai-grafana
    restart: unless-stopped
    environment:
      # Public URL incl. /grafana/ sub-path. Override GRAFANA_ROOT_URL in .env
      # if the portal is served on a different host/domain/scheme.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://100.77.162.66:9001/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Allow the dashboard to render inside the portal's <iframe>.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      # Anonymous read-only view (drop these two if you require Grafana login;
      # see the security note — anyone who can reach the portal sees the board).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Admin password for configuring data source / dashboards. Set
      # GRAFANA_ADMIN_PASSWORD in .env; do not ship a weak default to prod.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      # DB connection for the provisioned MySQL data source. These must be
      # present INSIDE the container: Grafana expands ${...} in the
      # provisioning YAML from its own process env, not from the compose .env.
      GRAFANA_DB_HOST: "${GRAFANA_DB_HOST}"
      GRAFANA_DB_NAME: "${GRAFANA_DB_NAME}"
      GRAFANA_DB_USER: "${GRAFANA_DB_USER}"
      GRAFANA_DB_PASSWORD: "${GRAFANA_DB_PASSWORD}"
    # Host 9401 -> container 3000. Optional: prod traffic goes through nginx
    # /grafana; expose it for direct debugging / first-time setup.
    ports:
      - "9401:3000"
    volumes:
      # Persist dashboards, data sources and Grafana's own SQLite state.
      - grafana-data:/var/lib/grafana
      # Auto-provision the MySQL data source + Skill Metrics dashboard on
      # startup (so uid=skill-metrics always exists and is Viewer-readable).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  judge-kiro-home:
  judge-kiro-share:
  db-data:
  grafana-data:
