# GitLab CI pipeline for the RP AI Portal backend (FastAPI + SQLAlchemy, Python 3.11).
#
# Stages:
#   lint  - static analysis with ruff (style + common bugs)
#   test  - install deps, verify the app imports cleanly, run pytest if present
#
# Notes:
#   * DATABASE_URL is a dummy value here: SQLAlchemy's create_engine is lazy, so
#     the app imports without a live MySQL. Set a real one in the project's
#     CI/CD variables (Settings > CI/CD > Variables) if a job needs the DB.
#   * Never commit real secrets to this file; use masked CI/CD variables instead.

default:
  image: python:3.11-slim

stages:
  - lint
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # Dummy DB URL so `import app.main` (which builds a lazy engine) succeeds.
  DATABASE_URL: "mysql+pymysql://ci:ci@localhost:3306/ci_db"
  # Skip skill-repo git pushes in CI.
  SKILL_REPO_PUSH: "false"

# Cache pip downloads across jobs/pipelines to speed up installs.
cache:
  key:
    files:
      - requirements.txt
  paths:
    - .pip-cache/

# Run for branch pushes and merge requests; avoid duplicate pipelines.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: lint
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff==0.8.4
  script:
    - ruff check .
  # Flip to false once the codebase is ruff-clean to make lint blocking.
  allow_failure: true

test:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt
  script:
    # Smoke check: the FastAPI app imports without errors.
    - python -c "import app.main; print('app.main imported OK')"
    # Run the test suite. GitLab runs scripts with `set -e`, so guard pytest
    # with `|| ec=$?` to capture its status without aborting the line.
    # Exit code 5 = "no tests collected" -> treat as success until tests exist.
    - |
      ec=0
      pytest -q || ec=$?
      if [ "$ec" -eq 5 ]; then echo "No tests collected yet"; ec=0; fi
      exit "$ec"

# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Deploy: copy the code to the deploy server over SSH and (re)build/start the
# container there with `docker compose`. No registry push — the server builds
# locally and runs the container persistently.
#
# Why SSH: the GitLab runner is a docker executor with no host Docker daemon
# (no docker.sock, no dind), so it cannot run a persistent container itself.
# It instead SSHes into the deploy server, which has Docker + compose.
#
# Required CI/CD variables (Settings > CI/CD > Variables) — mark Protected:
#   DEPLOY_HOST     deploy server hostname/IP
#   DEPLOY_USER     SSH login user (must be able to run docker on the server)
#   DEPLOY_DIR      target dir on the server (e.g. /proj/rp_ait_prod/services/ai-portal-be)
#   DEPLOY_SSH_KEY  (File) private key; its public key is in the server's authorized_keys
#   DEPLOY_PORT     (optional) SSH port, defaults to 22
#   PROD_ENV        (File) full production .env, copied to $DEPLOY_DIR/.env
#
# Server prerequisites: Docker + docker compose v2 + rsync installed, DEPLOY_USER
# can run docker, and the bind-mount paths in docker-compose.yml exist (Docker
# creates them on first run).
#
# Gated to main + manual: after merging to main, click ▶ to deploy.
# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  # Alpine-based image; we only need ssh + rsync (docker runs on the server).
  image: armdocker.rnd.ericsson.se/dockerhub-ericsson-remote/docker:26.1.4
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    # Preflight: fail fast with a clear message if required variables are empty
    # (e.g. Protected variables while main is not a protected branch).
    - |
      : "${DEPLOY_HOST:?not set — add DEPLOY_HOST in CI/CD Variables; if Protected, protect the main branch}"
      : "${DEPLOY_USER:?not set — add DEPLOY_USER in CI/CD Variables}"
      : "${DEPLOY_DIR:?not set — add DEPLOY_DIR in CI/CD Variables}"
      echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR} (port ${DEPLOY_PORT:-22})"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Normalize the key: strip CR (CRLF paste) and ensure a trailing newline —
    # both are common causes of "error in libcrypto". Then validate it parses.
    - |
      tr -d '\r' < "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
      printf '\n' >> ~/.ssh/id_deploy
      chmod 600 ~/.ssh/id_deploy
      if ssh-keygen -y -P "" -f ~/.ssh/id_deploy >/dev/null 2>&1; then
        echo "SSH private key parsed OK"
      else
        echo "ERROR: DEPLOY_SSH_KEY is not a valid passphrase-less private key."
        echo "Check it is the full PRIVATE key (BEGIN OPENSSH PRIVATE KEY ... END), no passphrase, no CRLF."
        exit 1
      fi
    - 'SSHBASE="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${DEPLOY_PORT:-22}"'
    # 1) sync the checked-out code to the server (keep server-side .env intact).
    - 'rsync -az --delete --exclude ".git" --exclude ".env" -e "ssh $SSHBASE" ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"'
    # 2) push the production .env from the PROD_ENV file variable.
    - 'rsync -az -e "ssh $SSHBASE" "$PROD_ENV" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/.env"'
    # 3) build + (re)start on the server, then show status. Pass the pushed
    #    commit SHA so the running build reports it at GET /api/version.
    - 'ssh $SSHBASE "$DEPLOY_USER@$DEPLOY_HOST" "cd \"$DEPLOY_DIR\" && GIT_COMMIT=\"$CI_COMMIT_SHORT_SHA\" docker compose up -d --build && docker compose ps"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  # Runs on the default (untagged) runner; it only needs network + SSH here.
