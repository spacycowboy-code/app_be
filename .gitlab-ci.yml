# 流水线来自共享模板。发布 / 回滚 / 排查见 platform-ci 的操作手册:
#   https://gitlab.internal.ericsson.com/rp-ai-miao/platform-ci/-/blob/main/README.md
# 端口、环境变量、挂载在 platform-ci 的 deploy/<环境>/。
# 本服务测试期需要的配置(属于服务自己,不进共享模板)。
variables:
  DATABASE_URL: "mysql+pymysql://ci:ci@localhost:3306/ci_db"
  SKILL_REPO_PUSH: "false"

include:
  - project: rp-ai-miao/platform-ci
    ref: v1
    file: templates/service.yml
    inputs:
      service: rp-ai-portal-be
      app_module: app.main:app
      apt_packages: "openssh-client"
      extra_pip: "pip install --no-cache-dir pipx && pipx install cisco-ai-skill-scanner==2.0.12 && skill-scanner --version"
      extra_dockerfile: Dockerfile.judge
      extra_service: skill-audit-judge
