# 流水线来自共享模板。发布 / 回滚 / 排查见 platform-ci 的操作手册:
#   https://gitlab.internal.ericsson.com/rp-ai-miao/platform-ci/-/blob/main/README.md
# 本仓只声明属于本服务的输入;端口、变量、挂载在 platform-ci 的 deploy/<环境>/。
variables:
  # 导入 app.main 时会校验配置,给一个假的库地址让导入通过(测试自己用 sqlite 临时库)。
  DATABASE_URL: "mysql+pymysql://ci:ci@localhost:3306/ci_db"
  # CI 里不要往技能仓推 git。
  SKILL_REPO_PUSH: "false"

# 流水线来自共享模板(见 rp-ai-miao/platform-ci 的 DESIGN.md)。
# 本仓声明属于自己的东西:两个镜像的构建输入。部署在 platform-ci 的 deploy/<env>/。
include:
  # 后端镜像:薄层(装依赖 + 拷源码),启动前先跑数据库迁移。
  - project: rp-ai-miao/platform-ci
    ref: v0.13.1
    file: templates/python-service.yml
    inputs:
      service: rp-ai-portal-be
      app_module: app.main:app
      apt_packages: "openssh-client"
      extra_pip: "pip install --no-cache-dir pipx && pipx install cisco-ai-skill-scanner==2.0.12 && skill-scanner --version"
      entrypoint: "/app/docker-entrypoint.sh"

  # 判定器镜像:配方与薄层实质不同(镜像里要装 kiro-cli),所以用本仓自带的 Dockerfile。
  - project: rp-ai-miao/platform-ci
    ref: v0.13.1
    file: templates/extra-image.yml
    inputs:
      service: skill-audit-judge
      dockerfile: Dockerfile.judge
      job_name: build-judge
